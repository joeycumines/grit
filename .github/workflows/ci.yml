name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos runners exercise case-insensitive filesystem paths,
        # symlink semantics, and executable-bit handling end to end.
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Check out
      uses: actions/checkout@v7
    - name: Build
      run: go build -v .
    - name: Test
      run: go test -v ./...
